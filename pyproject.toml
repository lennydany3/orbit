[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "Orbit: a local desktop-automation assistant (text CLI)."
requires-python = ">=3.12"
dependencies = [
    "ollama",
    "httpx",
    "pydantic>=2",
    "playwright",
    "pycaw",
    "psutil",
    "numpy",
    "winrt-runtime",
    "winrt-Windows.Media.Control",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Storage.Streams",
    "winrt-Windows.Media.Ocr",
    "winrt-Windows.Graphics.Imaging",
    "winrt-Windows.Globalization",
]

[project.optional-dependencies]
dev = ["pytest", "pyyaml", "websockets>=13"]
# The link to the sphere window (ui/): `python -m orbit --voice --ipc`.
ipc = ["websockets>=13"]
# Local voice, added step by step (V1 shown; later steps add faster-whisper, piper-tts, pynput, openwakeword).
# sherpa-onnx runs Parakeet, the fast speech-to-text (voice/stt_fast.py); faster-whisper stays for the wake-word check and as the fallback.
voice = ["sounddevice", "numpy", "onnxruntime", "psutil", "sherpa-onnx", "huggingface_hub", "faster-whisper", "piper-tts", "pyttsx3", "pynput", "openwakeword"]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orbit.voice" = ["alarms/*.wav", "alarms/*.md"]      # the reminder and timer sounds

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
