[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "Orbit: a local desktop-automation assistant (text CLI)."
requires-python = ">=3.12"
dependencies = [
    "ollama",
    "httpx",
    "pydantic>=2",
    "playwright",
    "pycaw",
    "winrt-runtime",
    "winrt-Windows.Media.Control",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Storage.Streams",
    "winrt-Windows.Media.Ocr",
    "winrt-Windows.Graphics.Imaging",
    "winrt-Windows.Globalization",
]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]
# Local voice, added step by step (V1 shown; later steps add faster-whisper, piper-tts, pynput, openwakeword).
voice = ["sounddevice", "numpy", "onnxruntime", "psutil", "faster-whisper", "piper-tts", "pyttsx3"]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
